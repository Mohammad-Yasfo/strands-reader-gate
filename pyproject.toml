[project]
name = "strands-reader-gate"
version = "0.1.0"
description = "A document reader agent that can only say what is printed on the page, built with Strands Agents and Amazon Bedrock"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Mohammad AlYasfo" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "strands-agents==1.63.0",
    "boto3==1.43.123",
]

[dependency-groups]
dev = ["pytest==9.2.0"]
# only for running the reader on Amazon Bedrock AgentCore Runtime
agentcore = ["bedrock-agentcore==1.25.2"]

[build-system]
requires = ["hatchling~=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reader_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
